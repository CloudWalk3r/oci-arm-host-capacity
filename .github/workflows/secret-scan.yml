name: Secret scan
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
env:
  GITLEAKS_VERSION: 8.30.1
jobs:
  scan:
    name: Secrets and forbidden files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Work out which commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          base=""
          head="$GITHUB_SHA"
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ -n "$base" ]; then echo "Scanning commits $base..$head"; else echo "Scanning full history up to $head"; fi

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan commits for secrets (gitleaks)
        id: gitleaks
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          report="$RUNNER_TEMP/gitleaks.json"
          args=(git --config .gitleaks.toml --redact --no-banner --exit-code 0
                --report-format json --report-path "$report")
          if [ -n "$BASE" ]; then
            args+=(--log-opts="$BASE..$HEAD")
          else
            args+=(--log-opts="$HEAD")
          fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}" .
          [ -s "$report" ] || echo "[]" > "$report"
          count=$(jq length "$report")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::\(.RuleID) in commit \(.Commit[0:8]) (value redacted)"' "$report"
            {
              echo "### Possible secrets found: $count"
              echo
              echo "| Rule | File | Line | Commit |"
              echo "|---|---|---|---|"
              jq -r '.[] | "| \(.RuleID) | `\(.File)` | \(.StartLine) | `\(.Commit[0:8])` |"' "$report"
              echo
              echo "Values are redacted. If any of these is a real credential it is already on GitHub:"
              echo "revoke and replace it, then remove it from the commit history."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No secrets found."
          fi

      - name: Check for forbidden files and filled-in examples
        id: files
        if: always()
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          # Real config, keys, caches and bot runtime data must never be committed.
          forbid='(^|/)\.env$|(^|/)\.env\.[^/]+$|\.(pem|key|p12|pfx)$|(^|/)id_(rsa|ecdsa|ed25519)[^/]*$|(^|/)oci_cache\.json$|(^|/)oci\.log$|^ai-bot/(data|downloads|jdownloader-config)/'
          allow='(^|/)\.env\.example$|^tests/resources/\.env(\.[^/]+)?\.test$'
          if [ -n "$BASE" ]; then range="$BASE..$HEAD"; else range="$HEAD"; fi
          bad_files=$(git log --format= --name-only --diff-filter=ACMR "$range" | sort -u \
                      | grep -E "$forbid" | grep -vE "$allow" || true)

          # Example env files may document variables but must not carry credential values.
          bad_values=""
          if [ -f ai-bot/.env.example ]; then
            bad_values=$(grep -nE '^[[:space:]]*[A-Z0-9_]*(KEY|TOKEN|SECRET|PASSWORD|HASH)[A-Z0-9_]*[[:space:]]*=[[:space:]]*[^[:space:]#]' ai-bot/.env.example || true)
          fi

          count=0
          {
            if [ -n "$bad_files" ]; then
              echo "### Forbidden files committed"
              echo
              echo "$bad_files" | sed 's/^/- `/; s/$/`/'
              echo
            fi
            if [ -n "$bad_values" ]; then
              echo "### Credential values in ai-bot/.env.example"
              echo
              echo "$bad_values" | cut -d= -f1 | sed 's/^/- line /'
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$bad_files" ]; then
            while read -r f; do echo "::error file=$f::Forbidden file committed (config, key, cache or runtime data)"; done <<< "$bad_files"
            count=$((count + $(echo "$bad_files" | wc -l)))
          fi
          if [ -n "$bad_values" ]; then
            while IFS=: read -r line rest; do echo "::error file=ai-bot/.env.example,line=$line::Credential variable has a value; leave it empty"; done <<< "$bad_values"
            count=$((count + $(echo "$bad_values" | wc -l)))
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then echo "No forbidden files or filled-in examples."; fi

      - name: Result
        if: always()
        env:
          LEAKS: ${{ steps.gitleaks.outputs.count }}
          FILES: ${{ steps.files.outputs.count }}
        run: |
          if [ "$LEAKS" != "0" ] || [ "$FILES" != "0" ]; then
            echo "::error::Secret scan failed (secrets: ${LEAKS:-scan error}, forbidden files/values: ${FILES:-check error}). See the job summary."
            exit 1
          fi
          echo "Secret scan passed."
