services:
  # Local Telegram Bot API server — lets the bot send files up to 2 GB
  # (public api.telegram.org caps bot uploads at 50 MB).
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - ./downloads:/downloads
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/ || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # JDownloader 2 — handles Cloudflare challenges, captchas, and host countdowns.
  # Driven by the bot over the MyJDownloader relay API.
  jdownloader:
    image: jlesage/jdownloader-2:latest
    container_name: jdownloader
    restart: unless-stopped
    environment:
      MYJDOWNLOADER_EMAIL: ${MYJD_EMAIL}
      MYJDOWNLOADER_PASSWORD: ${MYJD_PASSWORD}
      MYJDOWNLOADER_DEVICE_NAME: ${MYJD_DEVICE}
      JDOWNLOADER_HEADLESS: 1
      JDOWNLOADER_MAX_MEM: 384M
    volumes:
      - ./jdownloader-config:/config
      - ./downloads:/output
    # Optional: expose noVNC for manual JD management (captcha solving etc.)
    # ports:
    #   - "5800:5800"
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    image: ghcr.io/cloudwalk3r/ai-bot:${BOT_TAG:-latest}
    build: .
    container_name: ai-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      telegram-bot-api:
        condition: service_started
      jdownloader:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./downloads:/downloads
      # SSH key + known_hosts for /servers, /autopilot, /lantern (see ops-agent/install.sh).
      - ./ops-ssh:/app/ops-ssh:ro
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  telegram-bot-api-data:
